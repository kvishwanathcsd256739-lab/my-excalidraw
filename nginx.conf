# =============================================================================
# nginx.conf — Production configuration for Excalidraw SPA
# =============================================================================
#
# Key responsibilities:
#   1. Serve excalidraw-app/build/ as a static SPA
#   2. Route all unknown paths to index.html (SPA client-side routing)
#   3. Apply correct Cache-Control per asset type
#   4. Enable gzip compression
#   5. Add security response headers
#   6. Route access/error logs to Docker stdout/stderr
#   7. Support graceful shutdown via SIGQUIT (worker_shutdown_timeout)
#
# =============================================================================

# Auto-detect number of CPU cores for worker processes
worker_processes auto;

# Route error log to stderr so Docker captures it with `docker logs`
error_log /dev/stderr warn;

# Required — PID file location (nginx default, keep it)
pid /var/run/nginx.pid;

# Graceful shutdown: wait up to 10s for in-flight requests to complete
# when nginx receives SIGQUIT (sent by docker-compose stop_signal: SIGQUIT)
worker_shutdown_timeout 10s;

events {
    # Max simultaneous connections per worker process
    worker_connections 1024;
    # Accept multiple connections per epoll event (Linux performance)
    use epoll;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # MIME types
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # Route access log to /dev/stdout so `docker logs` captures requests.
    # Uses combined format plus request time for basic performance visibility.
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /dev/stdout main;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;



    # -------------------------------------------------------------------------
    # Gzip compression
    # Reduces JS/CSS/JSON transfer size by 60-80%.
    # gzip_vary: sends Vary: Accept-Encoding header for correct CDN caching.
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -------------------------------------------------------------------------
    # Server block
    # -------------------------------------------------------------------------
    server {
        listen       80;
        listen  [::]:80;
        server_name  _;

        # Root directory — where Vite build output is copied in the Dockerfile
        root   /usr/share/nginx/html;
        index  index.html;

        # ---------------------------------------------------------------------
        # Security headers
        # These are set on every response.
        # ---------------------------------------------------------------------
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "origin"        always;

        # Content-Security-Policy: intentionally permissive to not break
        # Firebase, Socket.IO, AI backend, and Google Fonts.
        # Tighten for your specific domain in production.
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: wss:;" always;

        # ---------------------------------------------------------------------
        # Cache-Control per asset type
        #
        # index.html        → no-cache: must always be checked for freshness
        #                     so the PWA service worker can detect new versions.
        #
        # service-worker.js → no-cache: CRITICAL. A stale service worker is
        #                     the #1 cause of PWA apps getting stuck on old
        #                     versions. Never cache this file.
        #
        # assets/*          → immutable + 1 year: Vite appends content hashes
        #                     to all JS/CSS filenames (e.g. index-Dxk3zP8g.js).
        #                     These are safe to cache permanently.
        #
        # fonts/*           → immutable + 1 year: same rationale as assets.
        #
        # locales/*         → 30 days: Workbox handles runtime caching of
        #                     locales. Keep a reasonable TTL here as backup.
        #
        # workbox-*.js      → 1 year: Workbox precache manifest files are
        #                     also content-hashed by vite-plugin-pwa.
        # ---------------------------------------------------------------------

        # index.html — never cache
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "origin" always;
            try_files $uri /index.html;
        }

        # Service worker — never cache
        location = /service-worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Vite-generated assets (content-hashed filenames) — cache permanently
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Self-hosted fonts — cache permanently
        location /fonts/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # Allow cross-origin font requests (required for font-face loading)
            add_header Access-Control-Allow-Origin "*" always;
            try_files $uri =404;
        }

        # Locale chunks (runtime-cached by Workbox, 30-day TTL here as backup)
        location /locales/ {
            add_header Cache-Control "public, max-age=2592000" always;
            try_files $uri =404;
        }

        # Workbox runtime files (content-hashed by vite-plugin-pwa)
        location ~* ^/workbox- {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # PWA manifest — short cache so icon/name changes propagate
        location = /manifest.webmanifest {
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # Favicon and icons — moderate cache
        location ~* \.(ico|png|svg|webp)$ {
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        # Health check endpoint — used by Docker HEALTHCHECK and load balancers
        # Returns 200 with no body. Must not be cached.
        location = /health {
            access_log off;
            add_header Content-Type "text/plain" always;
            add_header Cache-Control "no-cache" always;
            return 200 "ok";
        }

        # version.json — generated by scripts/build-version.js during build
        # Short cache so operators can see the deployed version quickly.
        location = /version.json {
            add_header Cache-Control "public, max-age=60" always;
            try_files $uri =404;
        }

        # robots.txt — short cache, frequently updated
        location = /robots.txt {
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # sitemap.xml — generated by vite-plugin-sitemap during build
        location = /sitemap.xml {
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # SPA catch-all: any path that doesn't match a real file or directory
        # is served as index.html. This is what makes client-side routing work
        # (e.g., navigating to /#room=abc,key directly or on page refresh).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hide nginx version from error pages and Server header
        server_tokens off;
    }
}
