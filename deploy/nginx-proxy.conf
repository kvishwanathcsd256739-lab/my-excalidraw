# =============================================================================
# deploy/nginx-proxy.conf
# Outer nginx reverse-proxy: SSL termination, HTTP→HTTPS redirect,
# and WebSocket proxying for excalidraw-room.
#
# Runs in the `nginx-proxy` Docker container (port 80 and 443 on the host).
# Proxies traffic to:
#   - http://excalidraw:80        (Excalidraw SPA)
#   - http://excalidraw-room:3002 (real-time collaboration WebSocket)
#
# TLS certificates are provided by Certbot/Let's Encrypt and mounted from
# /opt/excalidraw/certbot/conf/ on the host.
#
# To use this config, set DOMAIN in /opt/excalidraw/.env.production, then
# run deploy/certbot-init.sh before starting the stack.
# =============================================================================

# t2.micro has 1 vCPU — use 1 worker process
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time up=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # ── Gzip (compress before sending to client) ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # ── Rate limiting (protect against abuse on free tier) ───────────────────
    # Limit each IP to 20 requests/second burst to 50.
    # This is applied to the HTTPS server block below.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

    # ── Upstream definitions ──────────────────────────────────────────────────
    # Service names match container names in docker-compose.ec2.yml.
    upstream excalidraw_app {
        server excalidraw:80;
        keepalive 16;
    }

    upstream excalidraw_room {
        server excalidraw-room:3002;
        keepalive 8;
    }

    # =========================================================================
    # Server block 1: HTTP (port 80)
    # Handles two cases:
    #   a) Let's Encrypt ACME challenge → serve from certbot webroot
    #   b) Everything else → 301 redirect to HTTPS
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;  # catch-all; replace _ with $DOMAIN for strict matching

        server_tokens off;

        # Let's Encrypt ACME HTTP-01 challenge
        # Certbot writes challenge files to /var/www/certbot/
        # (mounted from /opt/excalidraw/certbot/www on the host)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Direct local health checks without HTTPS redirect
        location = /health {
            access_log off;
            proxy_pass http://excalidraw_app;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Server block 2: HTTPS (port 443)
    # Terminates TLS and proxies to the Excalidraw SPA container.
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        # DOMAIN is substituted by certbot-init.sh and deploy.sh
        # Replace with your actual domain name:
        server_name EXCALIDRAW_DOMAIN;

        server_tokens off;

        # ── TLS Configuration ─────────────────────────────────────────────────
        # Certificates are mounted from /opt/excalidraw/certbot/conf/
        ssl_certificate     /etc/letsencrypt/live/EXCALIDRAW_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/EXCALIDRAW_DOMAIN/privkey.pem;

        # Recommended TLS settings from Mozilla (Intermediate profile)
        # https://ssl-config.mozilla.org/
        ssl_session_timeout   1d;
        ssl_session_cache     shared:SSL:10m;
        ssl_session_tickets   off;

        # TLS 1.2 + 1.3 only (1.0 and 1.1 are deprecated)
        ssl_protocols         TLSv1.2 TLSv1.3;

        # Strong cipher suites; TLS 1.3 ciphers are automatically preferred
        ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP stapling: sends the OCSP response in the TLS handshake,
        # avoiding a client round-trip to Let's Encrypt's OCSP server.
        ssl_stapling         on;
        ssl_stapling_verify  on;
        resolver             1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout     5s;

        # Include Let's Encrypt recommended DH parameters (generated by certbot)
        # This file is created automatically by certbot-init.sh
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # ── Security Headers ──────────────────────────────────────────────────
        # HSTS: tell browsers to always use HTTPS for this domain for 1 year.
        # WARNING: only add `preload` after you are 100% sure this domain will
        # always use HTTPS. Removing preload takes months via the HSTS preload list.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header Referrer-Policy           "origin"                              always;
        add_header X-XSS-Protection          "1; mode=block"                       always;

        # ── Rate limiting ─────────────────────────────────────────────────────
        # 20 req/s per IP, allow burst of 50 (whiteboard actions can be bursty)
        limit_req zone=general burst=50 nodelay;

        # ── ACME challenge (renewal) ──────────────────────────────────────────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── WebSocket proxy for excalidraw-room (Socket.IO) ───────────────────
        # Socket.IO uses /socket.io/ as its default path.
        # WebSocket connections require special headers to upgrade from HTTP.
        # proxy_read_timeout is set high (86400s = 24h) for long-lived WS connections.
        location /socket.io/ {
            proxy_pass http://excalidraw_room;
            proxy_http_version 1.1;

            # Required WebSocket upgrade headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep WebSocket connections alive for up to 24 hours
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;

            # Disable buffering for WebSocket (real-time traffic must not be buffered)
            proxy_buffering off;
        }

        # ── Health check endpoint (used by deploy.sh and load balancers) ──────
        location = /health {
            access_log off;
            proxy_pass http://excalidraw_app;
        }

        # ── Proxy share link API to json.excalidraw.com with CORS headers ──
        location /api/v2/ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin 'https://EXCALIDRAW_DOMAIN' always;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass https://json.excalidraw.com/api/v2/;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            # Rewrite headers to pass upstream CORS/referrer check
            proxy_set_header Origin "https://excalidraw.com";
            proxy_set_header Referer "https://excalidraw.com/";
            proxy_set_header Host "json.excalidraw.com";

            # Hide any upstream CORS headers to avoid duplication
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            # Inject custom CORS headers back to client
            add_header Access-Control-Allow-Origin 'https://EXCALIDRAW_DOMAIN' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, X-Requested-With' always;
        }

        # ── AppFlowy GoTrue Auth ─────────────────────────────────────────────
        location /gotrue/ {
            proxy_pass http://172.17.0.1:9999;
            rewrite ^/gotrue(/.*)$ $1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # ── AppFlowy Collaboration WebSockets ────────────────────────────────
        location /ws {
            proxy_pass http://172.17.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # ── AppFlowy REST API ────────────────────────────────────────────────
        location /api {
            proxy_pass http://172.17.0.1:8000;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
                proxy_pass http://172.17.0.1:8000;
                proxy_request_buffering off;
                client_max_body_size 256M;
            }

            location /api/chat {
                proxy_pass http://172.17.0.1:8000;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding on;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 600s;
            }

            location /api/import {
                proxy_pass http://172.17.0.1:8000;
                proxy_read_timeout 600s;
                proxy_request_buffering off;
                proxy_buffering off;
                client_max_body_size 2G;
            }
        }

        # ── AppFlowy MinIO Storage Console ───────────────────────────────────
        location /minio/ {
            proxy_pass http://172.17.0.1:9001;
            rewrite ^/minio/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── AppFlowy MinIO Presigned S3 API ──────────────────────────────────
        location /minio-api/ {
            proxy_pass http://172.17.0.1:9000;
            rewrite ^/minio-api/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            client_max_body_size 0;
        }

        # ── AppFlowy Admin Console ───────────────────────────────────────────
        location /console {
            proxy_pass http://172.17.0.1:3001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        # ── AppFlowy Web Client Redirects ────────────────────────────────────
        location = /appflowy {
            return 301 $scheme://$http_host/app;
        }
        location = /appflowy/ {
            return 301 $scheme://$http_host/app;
        }

        # ── AppFlowy Web App routing paths (/app and /static) ────────────────
        location /app {
            proxy_pass http://172.17.0.1:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static {
            proxy_pass http://172.17.0.1:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /appflowy.ico {
            proxy_pass http://172.17.0.1:8008;
            proxy_set_header Host $host;
        }

        # ── Everything else → Excalidraw SPA ─────────────────────────────────
        location / {
            proxy_pass http://excalidraw_app;
            proxy_http_version 1.1;

            # Pass real client IP to the SPA's nginx access log
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep-alive connections to upstream
            proxy_set_header Connection "";

            # Timeouts (generous for large file uploads: 4MB allowed by the app)
            proxy_connect_timeout  60s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Buffer sizing for responses (static assets can be large JS bundles)
            proxy_buffer_size          16k;
            proxy_buffers              8 64k;
            proxy_busy_buffers_size    128k;
        }
    }

    # =========================================================================
    # Server block 3: Redirect old domain (13.60.225.36.nip.io) to new domain
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name 13.60.225.36.nip.io;

        ssl_certificate     /etc/letsencrypt/live/13.60.225.36.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/13.60.225.36.nip.io/privkey.pem;

        ssl_protocols         TLSv1.2 TLSv1.3;
        ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        location / {
            return 301 https://EXCALIDRAW_DOMAIN$request_uri;
        }
    }
}
