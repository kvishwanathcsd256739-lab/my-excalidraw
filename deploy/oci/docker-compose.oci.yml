# =============================================================================
# deploy/oci/docker-compose.oci.yml — OCI Production Stack (Build on ARM64)
# =============================================================================

services:

  # ── Outer Reverse Proxy (Nginx + SSL) ──────────────────────────────────────
  nginx-proxy:
    image: nginx:stable-alpine-slim
    container_name: excalidraw-proxy
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/excalidraw/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - /opt/excalidraw/logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"
    depends_on:
      - excalidraw
    networks:
      - excalidraw-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Certbot SSL Renewal Service ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: excalidraw-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot --webroot-path=/var/www/certbot --post-hook='docker kill --signal=SIGHUP excalidraw-proxy' --quiet;
      sleep 12h & wait \$${!};
      done"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"
    networks:
      - excalidraw-net
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

  # ── Excalidraw SPA Service (Built on ARM64) ─────────────────────────────────
  excalidraw:
    build:
      context: ../..
      dockerfile: Dockerfile.prebuilt
      args:
        NODE_ENV: production
    container_name: excalidraw-app
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    env_file:
      - /opt/excalidraw/.env.production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"
    networks:
      - excalidraw-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Excalidraw Room Collaboration Relay (Built natively on ARM64) ───────────
  excalidraw-room:
    image: excalidraw-room:local
    container_name: excalidraw-room
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PORT=3002
      - NODE_OPTIONS=--max-old-space-size=256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3002"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"
    networks:
      - excalidraw-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  excalidraw-net:
    driver: bridge

volumes:
  certbot-conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/excalidraw/certbot/conf
  certbot-www:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/excalidraw/certbot/www
